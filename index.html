<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DocNest — Study place for AI enthusiasts</title>
  <meta name="description" content="DocNest — a lightweight study place for AI enthusiasts. Search and explore docs, guides, and tutorials on anything AI." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://kaushix-api-service.onrender.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Nunito:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/markdown.css" />
  <link rel="stylesheet" href="css/portal.css" />
  <link rel="stylesheet" href="css/skins.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css" />
  <script src="js/theme.js"></script>
</head>
<body class="home">
  <a class="visually-hidden" href="#main-content">Skip to content</a>

  <header class="navbar">
    <div class="navbar-inner">
      <div class="navbar-brand-group">
        <button type="button" class="brand-mark" data-pen-launcher aria-label="Presentation ink" aria-expanded="false" aria-controls="pen-toolbar" title="Presentation ink (Esc to exit)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 19l7-7 3 3-7 7-3-3z" />
            <path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z" />
            <path d="M2 2l7.586 7.586" />
            <circle cx="11" cy="11" r="2" />
          </svg>
        </button>
        <a href="index.html" class="brand-wordmark">DocNest</a>
      </div>
      <nav class="nav-actions" aria-label="Primary">
        <a class="nav-link" href="browse.html">Learn</a>
        <a class="nav-link" href="papers.html">Papers</a>
        <a class="nav-link" href="annotate.html">Annotate</a>
      </nav>
    </div>
  </header>

  <main id="main-content">
    <section class="masthead">
      <p class="eyebrow masthead-eyebrow">Study notes · 2026</p>
      <h1 class="masthead-title">
        A field guide to <span class="accent">AI</span>.
      </h1>

      <div class="search-wrap masthead-search" id="search-wrap">
        <div class="search-input-group">
          <svg class="search-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
            <circle cx="7" cy="7" r="5" />
            <path d="M11 11L14.5 14.5" stroke-linecap="round" />
          </svg>
          <input
            type="search"
            id="search-input"
            placeholder="Search tutorials…"
            aria-label="Search tutorials"
            autocomplete="off"
          />
          <span class="kbd-hint" aria-hidden="true">/</span>
        </div>
        <div class="search-dropdown" id="search-dropdown" role="listbox" aria-label="Search results"></div>
      </div>
    </section>

    <div class="modules">
      <section class="module" aria-labelledby="module-learn">
        <header class="module-head">
          <h2 class="module-title" id="module-learn">Learn</h2>
          <a class="module-more" href="browse.html">All <span id="browse-all-count"></span> →</a>
        </header>
        <div class="module-list" id="track-index"></div>
      </section>

      <section class="module" aria-labelledby="module-papers">
        <header class="module-head">
          <h2 class="module-title" id="module-papers">Papers</h2>
          <a class="module-more" href="papers.html">All papers →</a>
        </header>
        <div class="paper-topics" id="paper-topics"></div>
      </section>

      <section class="module" id="continue-module" aria-labelledby="module-continue" hidden>
        <header class="module-head">
          <h2 class="module-title" id="module-continue">Continue</h2>
        </header>
        <div class="module-list" id="continue-list"></div>
      </section>
    </div>
  </main>

  <footer class="site-footer">
    <p>DocNest — a nest for your AI curiosity.</p>
    <p class="footer-links">
      Built by
      <a href="https://kaushixlabs.eskaykaushik14.workers.dev/" target="_blank" rel="noopener">Kaushix Labs</a>
      ·
      <a href="https://eskaykaushik.github.io/myProfile/" target="_blank" rel="noopener">Shubham Kaushik</a>
    </p>
  </footer>

  <div class="chat-widget" id="chat-widget">
    <button
      type="button"
      class="chat-launcher attention"
      id="chat-launcher"
      aria-label="Ask the AI teacher"
      aria-expanded="false"
      aria-controls="chat-panel"
    >
      <span class="chat-badge" id="chat-badge">1</span>
      <svg class="chat-launcher-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21 11.5a8.38 8.38 0 0 1-8.5 8.3c-1.2 0-2.3-.2-3.4-.6L4 21l1.2-3.6A8.38 8.38 0 1 1 21 11.5z"/>
      </svg>
      <svg class="chat-launcher-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true">
        <path d="M6 6l12 12M18 6L6 18"/>
      </svg>
    </button>

    <div class="chat-panel" id="chat-panel" role="dialog" aria-hidden="true" aria-label="Ask the AI teacher">
      <header class="chat-panel-header">
        <div class="chat-panel-heading">
          <span class="chat-avatar" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
              <path d="M22 9L12 4 2 9l10 5 10-5z"/>
              <path d="M6 11.5V16c0 1.5 2.7 3 6 3s6-1.5 6-3v-4.5"/>
              <path d="M22 9v5"/>
            </svg>
          </span>
          <div class="chat-panel-heading-text">
            <span class="chat-title">k-mentor</span>
            <span class="chat-subtitle">Your AI teacher · online</span>
          </div>
        </div>
        <div class="chat-header-actions">
          <button type="button" class="chat-clear" id="chat-clear" aria-label="Clear conversation" title="Clear conversation">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6M10 11v6M14 11v6"/>
            </svg>
          </button>
          <button type="button" class="chat-close" id="chat-close" aria-label="Close chat">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true">
              <path d="M6 6l12 12M18 6L6 18"/>
            </svg>
          </button>
        </div>
      </header>

      <div class="chat-body" id="chat-body" aria-live="polite"></div>

      <div class="chat-input-row">
        <input
          type="text"
          id="chat-input"
          placeholder="Ask anything about AI…"
          autocomplete="off"
          aria-label="Message the AI teacher"
        />
        <button type="button" class="chat-send" id="chat-send" aria-label="Send message">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script type="module" src="js/app.js"></script>
  <script type="module" src="js/easter.js"></script>
  <script type="module" src="js/appearance.js"></script>
  <script type="module" src="js/pen.js"></script>
  <script type="module" src="js/chat.js"></script>
  <script type="module" src="js/nav.js"></script>
</body>
</html>
