<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DocNest — Study place for AI enthusiasts</title>
  <meta name="description" content="DocNest — a lightweight study place for AI enthusiasts. Search and explore docs, guides, and tutorials on anything AI." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/markdown.css" />
  <link rel="stylesheet" href="css/portal.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css" id="hljs-theme" />
  <script>
    (function () {
      var theme = "dark";
      try {
        var stored = localStorage.getItem("docnest.theme");
        var dark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
        theme = stored || (dark ? "dark" : "light");
      } catch (e) { /* keep dark */ }
      document.documentElement.setAttribute("data-theme", theme);
      if (theme !== "dark") {
        var hl = document.getElementById("hljs-theme");
        if (hl) hl.href = hl.href.replace("atom-one-dark", "atom-one-light");
      }
    })();
  </script>
</head>
<body>
  <a class="visually-hidden" href="#main-content">Skip to content</a>

  <header class="navbar">
    <div class="navbar-inner">
      <a href="index.html" class="brand">
        <span class="brand-mark" aria-hidden="true">D</span>
        DocNest
      </a>
      <nav class="nav-actions" aria-label="Primary">
        <a class="nav-link" href="#learning-paths">Learning Paths</a>
        <div class="search-wrap" id="search-wrap">
          <div class="search-input-group">
            <svg class="search-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
              <circle cx="7" cy="7" r="5" />
              <path d="M11 11L14.5 14.5" stroke-linecap="round" />
            </svg>
            <input
              type="search"
              id="search-input"
              placeholder="Search a topic…"
              aria-label="Search tutorials"
              autocomplete="off"
            />
            <span class="kbd-hint" aria-hidden="true">/</span>
          </div>
          <div class="search-dropdown" id="search-dropdown" role="listbox" aria-label="Search results"></div>
        </div>
        <button type="button" class="theme-toggle" aria-label="Toggle theme" aria-pressed="true">
          <svg class="theme-toggle-icon theme-toggle-icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
          <svg class="theme-toggle-icon theme-toggle-icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
      </nav>
    </div>
  </header>

  <main id="main-content">
    <section class="hero">
      <h1 class="hero-title">A nest for your<br /><span class="accent">AI curiosity</span></h1>
      <p class="hero-subtitle">Lightweight docs on the AI tech you're learning.</p>
      <p class="hero-stats" id="hero-stats" aria-hidden="true"></p>
    </section>

    <div class="home-content">
      <div class="learning-paths" id="learning-paths"></div>
    </div>
  </main>

  <footer class="site-footer">
    <p>DocNest — a nest for your AI curiosity.</p>
    <p class="footer-links">
      Built by
      <a href="https://kaushixlabs.eskaykaushik14.workers.dev/" target="_blank" rel="noopener">Kaushix Labs</a>
      ·
      <a href="https://eskaykaushik.github.io/myProfile/" target="_blank" rel="noopener">Shubham Kaushik</a>
    </p>
  </footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script type="module" src="js/app.js"></script>
  <script type="module" src="js/theme.js"></script>
</body>
</html>
